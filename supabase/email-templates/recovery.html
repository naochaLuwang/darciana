<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #faf9f7; color: #38271d; font-family: Arial, sans-serif">
    <main
      style="
        max-width: 520px;
        margin: 32px auto;
        padding: 32px 24px;
        background: #fff;
        border: 1px solid #e8e0d8;
        border-radius: 12px;
      "
    >
      <p style="font-family: Georgia, serif; font-size: 24px">Daciana</p>
      <h1 style="font-size: 24px">Reset your password</h1>
      <p style="line-height: 1.6">Open this link on the device where you requested the reset.</p>
      <p style="margin: 28px 0">
        <a
          href="{{ .ConfirmationURL }}"
          style="
            display: inline-block;
            background: #38271d;
            color: #fff;
            padding: 14px 22px;
            border-radius: 6px;
            text-decoration: none;
          "
          >Set new password</a
        >
      </p>
      <p style="font-size: 14px; line-height: 1.6">
        If you didn’t request this, you can ignore this email. Your password stays the same.
      </p>
      <p style="font-size: 12px; color: #72665d">Daciana · Stationery &amp; Cosmetics</p>
    </main>
  </body>
</html>
